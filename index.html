<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Запрошення на побачення ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #ff4b72;
      --primary-hover: #e03b60;
      --bg-gradient: linear-gradient(135deg, #ffe6eb 0%, #ffd1dc 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text: #4a2d36;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comfortaa', cursive, sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      color: var(--text);
    }

    .bg-heart {
      position: fixed;
      color: rgba(255, 105, 135, 0.25);
      user-select: none;
      pointer-events: none;
      z-index: 0;
      animation: float 6s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-25px) rotate(15deg); }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 35px 25px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 15px 35px rgba(255, 105, 135, 0.2);
      text-align: center;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .step { display: none; }
    .step.active { display: block; }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: 20px;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 6px 16px rgba(255, 75, 114, 0.3);
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .no-btn-container {
      width: 110px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-no {
      background: #f1f2f6;
      color: #747d8c;
      border: 2px solid #ced6e0;
      padding: 12px 28px;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: default;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      user-select: none;
    }

    .no-btn-container:hover .btn-no {
      background: #ff4757;
      border-color: #ff4757;
      font-size: 1.8rem;
      padding: 6px 18px;
      transform: scale(1.2) rotate(10deg);
      box-shadow: 0 6px 20px rgba(255, 71, 87, 0.4);
    }

    .no-btn-container:hover .btn-no::after { content: "❤️"; }
    .no-btn-container:hover .btn-no span { display: none; }

    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #63454f;
    }

    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      border: 2px solid #ffd1dc;
      background: #fff;
      font-size: 1rem;
      color: var(--text);
      outline: none;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 25px;
    }

    .food-card {
      background: #fff;
      border: 2px solid #ffe3e8;
      border-radius: 18px;
      padding: 12px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
    }

    .food-card span.emoji { font-size: 2rem; }
    .food-card span.name { font-size: 0.9rem; font-weight: 600; }

    .food-card:hover {
      border-color: #ff94aa;
      transform: translateY(-2px);
    }

    .food-card.selected {
      border-color: var(--primary);
      background: #fff0f3;
      box-shadow: 0 4px 12px rgba(255, 75, 114, 0.15);
      transform: scale(1.02);
    }

    .summary-box {
      background: #fff0f3;
      border-radius: 16px;
      padding: 15px;
      margin: 15px 0 20px;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="bg-heart" style="top: 10%; left: 10%; font-size: 2rem;">💖</div>
  <div class="bg-heart" style="top: 80%; left: 15%; font-size: 2.5rem; animation-delay: 1s;">🌸</div>
  <div class="bg-heart" style="top: 20%; right: 12%; font-size: 2.2rem; animation-delay: 2s;">✨</div>
  <div class="bg-heart" style="top: 75%; right: 10%; font-size: 1.8rem; animation-delay: 3s;">💕</div>

  <div class="card">
    
    <!-- КРОК 1 -->
    <div class="step active" id="step1">
      <div style="font-size: 3rem; margin-bottom: 10px;">💌</div>
      <h1>Ти підеш зі мною на побачення?</h1>
      <div class="btn-group">
        <button class="btn" onclick="nextStep(2)">Так! 🥰</button>
        <div class="no-btn-container">
          <div class="btn-no"><span>Ні</span></div>
        </div>
      </div>
    </div>

    <!-- КРОК 2 -->
    <div class="step" id="step2">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">📅</div>
      <h1>Коли тобі зручно?</h1>
      <div class="input-group">
        <label for="date-input">Обери день:</label>
        <input type="date" id="date-input" />
      </div>
      <div class="input-group">
        <label for="time-input">Обери приблизний час:</label>
        <input type="time" id="time-input" value="18:30" />
      </div>
      <button class="btn" style="width: 100%; margin-top: 10px;" onclick="goToFoodStep()">Далі 🍓</button>
    </div>

    <!-- КРОК 3 -->
    <div class="step" id="step3">
      <div style="font-size: 2.5rem; margin-bottom: 10px;">🍕</div>
      <h1>Що смачненького поїмо?</h1>
      <p style="font-size: 0.85rem; color: #888; margin-bottom: 15px;">(Можна обрати кілька)</p>
      
      <div class="food-grid">
        <div class="food-card" onclick="toggleFood(this, 'Піца 🍕')">
          <span class="emoji">🍕</span><span class="name">Піца</span>
        </div>
        <div class="food-card" onclick="toggleFood(this, 'Суші 🍣')">
          <span class="emoji">🍣</span><span class="name">Суші</span>
        </div>
        <div class="food-card" onclick="toggleFood(this, 'Бургери 🍔')">
          <span class="emoji">🍔</span><span class="name">Бургери</span>
        </div>
        <div class="food-card" onclick="toggleFood(this, 'Рамен 🍜')">
          <span class="emoji">🍜</span><span class="name">Рамен</span>
        </div>
        <div class="food-card" onclick="toggleFood(this, 'Паста 🍝')">
          <span class="emoji">🍝</span><span class="name">Паста</span>
        </div>
        <div class="food-card" onclick="toggleFood(this, 'Десертики 🍰')">
          <span class="emoji">🍰</span><span class="name">Десертики</span>
        </div>
      </div>

      <button class="btn" style="width: 100%;" onclick="finishSelection()">Готово! ✨</button>
    </div>

    <!-- КРОК 4 -->
    <div class="step" id="step4">
      <div style="font-size: 3rem; margin-bottom: 10px;">🎉❤️</div>
      <h1>Урааа! Домовилися!</h1>
      <p style="font-size: 0.95rem; margin-bottom: 10px;">Я вже з нетерпінням чекаю нашого побачення 🥰</p>
      
      <div class="summary-box" id="summary-content"></div>

      <button id="submit-btn" class="btn" style="width: 100%;" onclick="submitToTelegram()">Підтвердити та відправити 💌</button>
      <p id="status-msg" style="font-size: 0.85rem; margin-top: 10px; display: none;"></p>
    </div>

  </div>

  <script>
    // ================= НАЛАШТУВАННЯ TELEGRAM =================
    const TELEGRAM_BOT_TOKEN = '8678380721:AAHTrQWVCIcE1xsPCPO1VJoOTjwMPgM1Dug';
    const TELEGRAM_CHAT_ID = '716509642';
    // =======================================================

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date-input').min = today;
    document.getElementById('date-input').value = today;

    let selectedFoods = [];

    function nextStep(stepNum) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step' + stepNum).classList.add('active');
    }

    function goToFoodStep() {
      const date = document.getElementById('date-input').value;
      if (!date) {
        alert('Будь ласка, обери дату ✨');
        return;
      }
      nextStep(3);
    }

    function toggleFood(element, foodName) {
      element.classList.toggle('selected');
      if (selectedFoods.includes(foodName)) {
        selectedFoods = selectedFoods.filter(item => item !== foodName);
      } else {
        selectedFoods.push(foodName);
      }
    }

    function finishSelection() {
      if (selectedFoods.length === 0) {
        alert('Обери хоча б щось смачненьке 😊');
        return;
      }

      const date = document.getElementById('date-input').value;
      const time = document.getElementById('time-input').value;
      const foodsText = selectedFoods.join(', ');

      document.getElementById('summary-content').innerHTML = `
        <strong>📅 Дата:</strong> ${date}<br>
        <strong>⏰ Час:</strong> ${time}<br>
        <strong>🍽️ Що їмо:</strong> ${foodsText}
      `;

      nextStep(4);
    }

    async function submitToTelegram() {
      const btn = document.getElementById('submit-btn');
      const status = document.getElementById('status-msg');

      const date = document.getElementById('date-input').value;
      const time = document.getElementById('time-input').value;
      const foodsText = selectedFoods.join(', ');

      const text = `🎉 Вона погодилась на побачення!\n\n📅 Дата: ${date}\n⏰ Час: ${time}\n🍽️ Меню: ${foodsText}`;

      btn.disabled = true;
      btn.innerText = 'Надсилаю... ⏳';

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: text
          })
        });

        if (response.ok) {
          btn.innerText = 'Відправлено! ❤️';
          status.style.display = 'block';
          status.style.color = '#27ae60';
          status.innerText = 'Повідомлення успішно доставлено!';
        } else {
          throw new Error('Помилка надсилання');
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerText = 'Спробувати ще раз';
        status.style.display = 'block';
        status.style.color = '#e74c3c';
        status.innerText = 'Не вдалося надіслати. Перевір токен та Chat ID.';
      }
    }
  </script>
</body>
</html>
